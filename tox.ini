[tox]
envlist = py39, py310, py311, py312, py313, lint, type, docs
isolated_build = True
skip_missing_interpreters = True

[testenv]
deps =
    pytest>=7.4
    pytest-cov>=4.1
    hypothesis>=6.90
commands =
    pytest {posargs:tests}

[testenv:lint]
skip_install = True
deps =
    black>=24.1
    isort>=5.13
    ruff>=0.3
commands =
    black --check discretus tests
    isort --check-only discretus tests
    ruff check discretus tests

[testenv:type]
deps =
    mypy>=1.8
commands =
    mypy discretus

[testenv:docs]
deps =
    -r requirements-docs.txt
commands =
    sphinx-build -b html docs docs/_build/html
