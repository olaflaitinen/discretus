# Version bump configuration for discretus.
#
# The project follows Semantic Versioning 2.0.0. The version string appears
# in several files that must never disagree, because the release workflow
# refuses to publish when the git tag and the declared version differ. This
# file lists every one of those files so that a single command updates all
# of them at once and creates the matching commit and tag.
#
# Usage, with bump2version or the bumpversion successor installed:
#
#   bump2version patch     # 1.0.0 becomes 1.0.1
#   bump2version minor     # 1.0.0 becomes 1.1.0
#   bump2version major     # 1.0.0 becomes 2.0.0
#
# Inspect the effect without touching the working tree:
#
#   bump2version --dry-run --verbose minor
#
# The helper scripts/bump_version.py wraps these calls, additionally
# rewrites the __version_info__ tuple in discretus/__about__.py, which a
# plain search and replace cannot express, and moves the Unreleased
# section of CHANGELOG.md under the new version heading. Prefer the helper
# and treat this file as the declaration of where the version lives.

[bumpversion]
current_version = 1.0.0
parse = (?P<major>\d+)\.(?P<minor>\d+)\.(?P<patch>\d+)
serialize = {major}.{minor}.{patch}

# Create the commit and the annotated tag, but never push. Pushing is a
# deliberate second step, because the release workflow triggers on the tag
# and a mistaken push cannot be recalled.
commit = True
tag = True
tag_name = v{new_version}
sign_tags = True
allow_dirty = False

message = chore(release): bump version from {current_version} to {new_version}
tag_message = discretus {new_version}

# The canonical declaration. Every other occurrence is derived from it.
[bumpversion:file:discretus/__about__.py]
search = __version__ = "{current_version}"
replace = __version__ = "{new_version}"

# Packaging metadata read by the build backend.
[bumpversion:file:pyproject.toml]
search = version = "{current_version}"
replace = version = "{new_version}"

# Citation metadata. The version appears twice, once at the top level and
# once inside the preferred citation block, and both are updated because the
# replacement applies to every occurrence in the file.
[bumpversion:file:CITATION.cff]
search = version: {current_version}
replace = version: {new_version}

# Archival and software metadata records.
[bumpversion:file(zenodo):.zenodo.json]
search = "version": "{current_version}"
replace = "version": "{new_version}"

[bumpversion:file(codemeta-version):codemeta.json]
search = "version": "{current_version}"
replace = "version": "{new_version}"

[bumpversion:file(codemeta-software-version):codemeta.json]
search = "softwareVersion": "{current_version}"
replace = "softwareVersion": "{new_version}"

# The bibliographic example in the README, so that a reader who copies it
# never cites a version that was never released.
[bumpversion:file:README.md]
search = version = {{{current_version}}}
replace = version = {{{new_version}}}

# The container image label, which release tooling reads to identify the
# artifact a running container was built from.
[bumpversion:file:Dockerfile]
search = discretus:{current_version}
replace = discretus:{new_version}

# Files that intentionally do not participate.
#
#   CHANGELOG.md          the helper rewrites the Unreleased heading and
#                         inserts the comparison links, which needs more
#                         than a substitution
#   discretus/__about__.py the __version_info__ tuple is rewritten by the
#                         helper for the same reason
#   docs/conf.py          reads the version from the installed package, so
#                         there is nothing to substitute
#   environment.yml       pins tooling, not the library version
