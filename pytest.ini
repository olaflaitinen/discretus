[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --strict-markers
markers =
    slow: tests that take a noticeable amount of time
    property: property based tests asserting algebraic laws
    optional: tests that require an optional dependency
filterwarnings =
    error::DeprecationWarning
