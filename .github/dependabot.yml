version: 2

updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: build
      include: scope
    groups:
      lint-and-type:
        patterns:
          - black
          - isort
          - ruff
          - pylint
          - mypy
          - bandit
      testing:
        patterns:
          - pytest*
          - hypothesis
      documentation:
        patterns:
          - sphinx*
          - myst-parser
          - furo

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: ci
      include: scope

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    labels:
      - dependencies
    commit-message:
      prefix: build
