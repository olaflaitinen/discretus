name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Verify the tagged commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the package and the test stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest hypothesis

      - name: Run the test suite
        run: python -m pytest tests

      - name: Check that the tag matches the declared version
        run: |
          declared=$(python -c "import discretus; print(discretus.__version__)")
          tagged="${GITHUB_REF_NAME#v}"
          echo "declared=$declared tagged=$tagged"
          test "$declared" = "$tagged"

  build:
    name: Build the distribution
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build and check
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: Upload the artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-distribution
          path: dist/

  publish:
    name: Publish to the Python Package Index
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download the artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-distribution
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  github-release:
    name: Create the GitHub release
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download the artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-distribution
          path: dist/

      - name: Publish the release notes
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
