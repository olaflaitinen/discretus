# Documentation build and example verification for discretus.
#
# The documentation is part of the product rather than a description of it.
# Every reference page states the mathematical basis of its package and the
# asymptotic complexity of its routines, every docstring carries a runnable
# example, and every example script under examples/ is a complete program.
# All three are executed here, so a documentation change that stops working
# fails the pipeline rather than misleading a reader.
#
# Job overview:
#
#   build        The HTML site, with warnings reported.
#   strict       The same build with warnings treated as errors.
#   doctest      Every example in every docstring.
#   examples     Every runnable program under examples/.
#   coverage     The public objects that have no reference entry.
#   links        The external addresses, advisory only.
#   pdf          The PDF build, advisory only.
#   summary      A single required check that aggregates the rest.

name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # A weekly run catches an external address that has gone away, which is
  # not caused by any change in the repository.
  schedule:
    - cron: "0 5 * * 3"

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FORCE_COLOR: "1"

jobs:
  # ---------------------------------------------------------------------------
  # The HTML build
  # ---------------------------------------------------------------------------
  build:
    name: Build the HTML documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # docs/conf.py reads the version from the installed package and the
          # theme links each page to its source, so the history is needed.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-docs.txt

      - name: Install the package and the documentation stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r requirements-docs.txt

      - name: Report the toolchain versions
        run: |
          python -m sphinx --version
          python -c "import myst_parser; print('myst-parser', myst_parser.__version__)"

      - name: Build
        run: python -m sphinx -b html docs docs/_build/html

      - name: Confirm that every expected page was produced
        # A page missing from the output usually means it is missing from a
        # toctree, which Sphinx reports as a warning that is easy to miss.
        run: |
          python - <<'PY'
          import pathlib
          import sys

          root = pathlib.Path("docs/_build/html")
          expected = [
              "index.html",
              "installation.html",
              "quickstart.html",
              "contributing.html",
              "changelog.html",
          ]
          expected += [f"api/{name}.html" for name in (
              "core", "sets", "logic", "combinatorics", "graphs",
              "number_theory", "recurrences", "algebra", "viz", "io", "utils",
          )]
          expected += [f"tutorials/{name}.html" for name in (
              "getting_started", "set_theory", "sat_solving",
              "graph_algorithms", "number_theory", "group_theory",
          )]

          missing = [name for name in expected if not (root / name).exists()]
          if missing:
              print("pages missing from the built site:")
              for name in missing:
                  print("  ", name)
              sys.exit(1)
          print(f"all {len(expected)} expected pages were produced")
          PY

      - name: Upload the built site
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: docs/_build/html
          retention-days: 14

  # ---------------------------------------------------------------------------
  # The strict build
  # ---------------------------------------------------------------------------
  strict:
    name: Build with warnings as errors
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r requirements-docs.txt

      - name: Build strictly
        # The keep going flag reports every warning rather than stopping at
        # the first one, so a documentation fix is a single pass instead of
        # several. This is the same invocation as `make -C docs strict`.
        run: python -m sphinx -b html -W --keep-going docs docs/_build/strict

  # ---------------------------------------------------------------------------
  # Docstring examples
  # ---------------------------------------------------------------------------
  doctest:
    name: Docstring examples
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The examples must produce identical output on every platform and
        # interpreter, which is the determinism guarantee stated in the
        # documentation. Running them on three platforms is how that is
        # checked rather than assumed.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.12"]
        exclude:
          - os: macos-latest
            python-version: "3.9"
          - os: windows-latest
            python-version: "3.9"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Run the docstring examples
        # Every public routine carries a doctest, and the project treats a
        # broken example as a defect rather than as documentation drift.
        run: python -m pytest --doctest-modules discretus -q

      - name: Run the examples in the documentation pages
        # The Sphinx doctest builder picks up the examples in the reference
        # and the tutorials, which pytest does not see.
        if: matrix.os == 'ubuntu-latest'
        run: |
          python -m pip install -r requirements-docs.txt
          python -m sphinx -b doctest docs docs/_build/doctest

  # ---------------------------------------------------------------------------
  # Example scripts
  # ---------------------------------------------------------------------------
  examples:
    name: Runnable examples
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install with the visualization extra
        # Some examples render a figure, so the extra is installed here. The
        # examples that need the Graphviz binaries skip themselves when the
        # binaries are absent.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[viz]"

      - name: Install the Graphviz binaries
        run: sudo apt-get update && sudo apt-get install --yes graphviz

      - name: Run every example script
        # Each example is a complete program focused on one topic. A failure
        # here means either the example or the library changed, and both are
        # worth knowing about.
        run: |
          shopt -s nullglob
          scripts=(examples/*_demo.py)
          if [ ${#scripts[@]} -eq 0 ]; then
            echo "no example scripts present yet"
            exit 0
          fi
          for script in "${scripts[@]}"; do
            echo "::group::${script}"
            python "${script}"
            echo "::endgroup::"
          done

      - name: Run every example twice and compare the output
        # The library guarantees deterministic output, so an example that
        # differs between two runs has an unseeded randomized call or an
        # order that escaped the sorting.
        run: |
          shopt -s nullglob
          for script in examples/*_demo.py; do
            python "${script}" > first.txt
            python "${script}" > second.txt
            if ! diff -q first.txt second.txt > /dev/null; then
              echo "${script} is not deterministic"
              diff first.txt second.txt || true
              exit 1
            fi
          done
          echo "every example is deterministic across two runs"

  # ---------------------------------------------------------------------------
  # Reference coverage
  # ---------------------------------------------------------------------------
  coverage:
    name: Reference coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r requirements-docs.txt

      - name: Report the public objects with no reference entry
        # Advisory rather than blocking, because the reference pages are
        # written by hand and the coverage builder reports the difference
        # against what autodoc would have produced.
        run: python -m sphinx -b coverage docs docs/_build/coverage

      - name: Print the coverage report
        if: always()
        run: |
          if [ -f docs/_build/coverage/python.txt ]; then
            cat docs/_build/coverage/python.txt
          else
            echo "no coverage report was produced"
          fi

      - name: Confirm that every package has a reference page
        # This part is blocking. A package with no reference page is
        # undocumented, and the toctree in docs/index.md is where that is
        # noticed.
        run: |
          python - <<'PY'
          import pathlib
          import sys

          packages = [
              "core", "sets", "logic", "combinatorics", "graphs",
              "number_theory", "recurrences", "algebra", "viz", "io", "utils",
          ]
          missing = [
              name for name in packages
              if not pathlib.Path(f"docs/api/{name}.md").exists()
          ]
          if missing:
              print("packages with no reference page:", missing)
              sys.exit(1)

          index = pathlib.Path("docs/index.md").read_text(encoding="utf-8")
          unlisted = [name for name in packages if f"api/{name}" not in index]
          if unlisted:
              print("reference pages missing from the index toctree:", unlisted)
              sys.exit(1)
          print("every package has a reference page and appears in the index")
          PY

  # ---------------------------------------------------------------------------
  # External addresses
  # ---------------------------------------------------------------------------
  links:
    name: Link check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Advisory. An address outside the repository can go away for reasons
    # that have nothing to do with a change, and failing a pull request for
    # that would be unhelpful.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r requirements-docs.txt

      - name: Check the links
        # The ignore list in docs/conf.py excludes the badge endpoints, which
        # redirect and rate limit, and the archival identifier, which is a
        # placeholder until the first deposition.
        run: python -m sphinx -b linkcheck docs docs/_build/linkcheck

      - name: Upload the link report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linkcheck-report
          path: docs/_build/linkcheck/output.txt
          retention-days: 7
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # The PDF build
  # ---------------------------------------------------------------------------
  pdf:
    name: Build the PDF
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Advisory. The PDF is offered as a convenience, and a LaTeX toolchain
    # failure should not block a change to a docstring.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the LaTeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            latexmk texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended tex-gyre

      - name: Install the documentation stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r requirements-docs.txt

      - name: Build
        # The documentation states theorems, so the mathematics packages in
        # the preamble of docs/conf.py are load bearing here.
        run: python -m sphinx -M latexpdf docs docs/_build

      - name: Upload the PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documentation-pdf
          path: docs/_build/latex/*.pdf
          retention-days: 14
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Aggregate status
  # ---------------------------------------------------------------------------
  summary:
    name: Docs summary
    needs:
      - build
      - strict
      - doctest
      - examples
      - coverage
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Report the result of every blocking job
        run: |
          echo "build:    ${{ needs.build.result }}"
          echo "strict:   ${{ needs.strict.result }}"
          echo "doctest:  ${{ needs.doctest.result }}"
          echo "examples: ${{ needs.examples.result }}"
          echo "coverage: ${{ needs.coverage.result }}"

      - name: Fail when any blocking job did not succeed
        if: >-
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled')
        run: exit 1
