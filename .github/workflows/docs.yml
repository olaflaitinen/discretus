name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build the documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the documentation stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r requirements-docs.txt

      - name: Build the HTML documentation
        run: sphinx-build -b html docs docs/_build/html

      - name: Check external links
        run: sphinx-build -b linkcheck docs docs/_build/linkcheck || true

      - name: Upload the built site
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: docs/_build/html

  doctest:
    name: Run the documentation examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Run the docstring examples
        run: python -m pytest --doctest-modules discretus

      - name: Run every example script
        run: |
          for script in examples/*_demo.py; do
            echo "running $script"
            python "$script" > /dev/null
          done
