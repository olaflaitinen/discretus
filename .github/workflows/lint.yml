name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  style:
    name: Formatting and static lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the lint stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install black isort ruff pylint

      - name: Check formatting with black
        run: python -m black --check --diff discretus tests examples benchmarks

      - name: Check import order with isort
        run: python -m isort --check-only --diff discretus tests examples benchmarks

      - name: Run ruff
        run: python -m ruff check discretus tests examples benchmarks

      - name: Run pylint
        run: python -m pylint discretus

  types:
    name: Static typing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the type checking stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install mypy

      - name: Run mypy
        run: python -m mypy discretus

  security:
    name: Security analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install bandit
        run: |
          python -m pip install --upgrade pip
          python -m pip install bandit

      - name: Run bandit
        run: python -m bandit -c .bandit -r discretus

  prose:
    name: Prose conventions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Reject long dash characters and emoji
        run: |
          python - <<'PY'
          import pathlib
          import sys
          import unicodedata

          SUFFIXES = {".py", ".md", ".txt", ".cfg", ".ini", ".toml", ".yml", ".yaml"}
          FORBIDDEN_DASHES = {"—", "–"}
          failures = []

          for path in sorted(pathlib.Path(".").rglob("*")):
              if not path.is_file() or path.suffix not in SUFFIXES:
                  continue
              if ".git" in path.parts or "_build" in path.parts:
                  continue
              text = path.read_text(encoding="utf-8", errors="replace")
              for number, line in enumerate(text.splitlines(), start=1):
                  for character in line:
                      if character in FORBIDDEN_DASHES:
                          failures.append(f"{path}:{number}: long dash character")
                          break
                      if unicodedata.category(character) == "So":
                          failures.append(f"{path}:{number}: emoji or symbol character")
                          break

          if failures:
              print("\n".join(failures))
              sys.exit(1)
          print("prose conventions satisfied")
          PY
