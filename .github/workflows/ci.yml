name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }} with Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        exclude:
          - os: macos-latest
            python-version: "3.9"
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.11"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install the package and the test stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-cov hypothesis

      - name: Run the test suite
        run: python -m pytest --cov=discretus --cov-report=xml --cov-report=term-missing tests

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  import-check:
    name: Import check without optional extras
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the package only
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Import the package and print the version
        run: python -c "import discretus; print(discretus.__version__)"

      - name: Exercise the command line interface
        run: |
          python -m discretus prime 2147483647
          python -m discretus factor 600851475143
          python -m discretus cnf "p -> (q -> r)"

  package:
    name: Build and verify the distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build the distribution
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Check the metadata
        run: python -m twine check dist/*

      - name: Upload the artifacts
        uses: actions/upload-artifact@v4
        with:
          name: distribution
          path: dist/
